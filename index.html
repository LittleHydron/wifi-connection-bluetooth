<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPi WiFi Setup</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 1rem; cursor: pointer; margin-bottom: 1rem; width: 100%; }
        button:disabled { background: #ccc; }
        .network-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .status { padding: 10px; background: #f8f9fa; border-radius: 5px; margin-bottom: 1rem; font-family: monospace; font-size: 0.9rem; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>🛠️ RPi WiFi Configurator</h2>
    
    <div id="status" class="status">Готово до підключення...</div>
    
    <button id="connectBtn">🔌 1. Підключитися до USB</button>
    <button id="scanBtn" disabled>🔄 2. Сканувати мережі</button>

    <div id="list"></div>

<script>
    let port, writer, reader;

    const statusDiv = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');
    const scanBtn = document.getElementById('scanBtn');
    const listDiv = document.getElementById('list');

    function log(msg) { statusDiv.innerText = msg; }

    // 1. ПІДКЛЮЧЕННЯ
    connectBtn.onclick = async () => {
        if (!navigator.serial) return alert("Потрібен Chrome або Edge!");
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            
            log("✅ USB підключено!");
            connectBtn.disabled = true;
            scanBtn.disabled = false;
            
            readLoop(); // Починаємо слухати відповіді
        } catch (e) {
            log("❌ Помилка: " + e);
        }
    };

    // 2. ЧИТАННЯ ДАНИХ
    async function readLoop() {
        const textDecoder = new TextDecoderStream();
        const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
        const reader = textDecoder.readable.getReader();

        let buffer = "";

        try {
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += value;

                let lines = buffer.split('\n');
                buffer = lines.pop(); // Залишаємо незавершене

                for (const line of lines) {
                    if (line.trim()) handleResponse(line);
                }
            }
        } catch (e) { console.error(e); }
    }

    // 3. ОБРОБКА ВІДПОВІДІ
    function handleResponse(jsonStr) {
        try {
            const msg = JSON.parse(jsonStr);
            console.log("Received:", msg);

            if (msg.type === "scan") {
                renderList(msg.data);
                log("✅ Сканування завершено");
            } else if (msg.type === "connect") {
                if (msg.data.status === "success") {
                    alert("Успіх! " + msg.data.msg);
                    log("🌐 " + msg.data.msg);
                } else {
                    alert("Помилка: " + msg.data.msg);
                    log("❌ " + msg.data.msg);
                }
            }
        } catch (e) { console.log("JSON Error:", e); }
    }

    // 4. ВІДПРАВКА КОМАНД
    async function send(data) {
        const encoder = new TextEncoder();
        const writer = port.writable.getWriter();
        await writer.write(encoder.encode(data + "\n"));
        writer.releaseLock();
    }

    scanBtn.onclick = () => {
        log("🔍 Сканую...");
        listDiv.innerHTML = "";
        send("SCAN");
    };

    function renderList(networks) {
        listDiv.innerHTML = networks.map(n => `
            <div class="network-item">
                <div>
                    <strong>${n.ssid}</strong> <small>(${n.signal}%)</small>
                </div>
                <button style="width:auto; margin:0; font-size:0.8rem" 
                        onclick="connect('${n.ssid}')">Connect</button>
            </div>
        `).join('');
    }

    window.connect = (ssid) => {
        const pass = prompt(`Пароль для ${ssid}:`);
        if (pass !== null) {
            log(`⏳ Підключаюсь до ${ssid}...`);
            send(`CONNECT|${ssid}|${pass}`);
        }
    };

</script>
</body>
</html>
