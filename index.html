<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi Wi-Fi Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Wi-Fi Manager</h1>
            <div id="connectionStatus" class="status-badge disconnected">Disconnected</div>
            <button id="bleDisconnectBtn" class="disconnect-link hidden">Відключити пристрій</button>
        </header>

        <div id="connectSection">
            <button id="bleConnectBtn" class="primary-btn">📡 Підключитися до Raspberry Pi</button>
        </div>

        <div id="wifiSection" class="hidden">
            <div class="wifi-header">
                <h2>Доступні мережі</h2>
                <button id="refreshBtn" class="icon-btn">🔄</button>
            </div>
            
            <ul id="networkList" class="network-list">
                <li class="loading">Очікування даних...</li>
            </ul>
        </div>
    </div>

    <div id="passwordModal" class="modal hidden">
        <div class="modal-content">
            <h3>Підключення до <span id="modalSsidName"></span></h3>
            <input type="password" id="wifiPassword" placeholder="Введіть пароль" />
            <div class="modal-actions">
                <button id="cancelModalBtn" class="secondary-btn">Скасувати</button>
                <button id="confirmConnectBtn" class="primary-btn">Підключитися</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
