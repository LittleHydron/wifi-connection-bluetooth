<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPi Wi-Fi Setup via BLE</title>
<style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f9f9f9; }
    h2 { color: #333; }
    
    /* Стилі для кнопок та UI */
    .network { padding: 10px; margin-bottom: 8px; background: white; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .network:hover { background-color: #eef; border-color: #ccf; }
    .badge { padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; font-weight: bold; }
    .connected { background-color: #4caf50; color: white; }
    .secure { color: #f39c12; margin-right: 5px; }
    .signal { background-color: #aaa; color: white; }
    
    /* Модальне вікно */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
    .modal-content { background: white; padding: 20px; margin: 20vh auto; width: 90%; max-width: 350px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .modal-header { font-weight: bold; margin-bottom: 1rem; font-size: 1.1rem; }
    .modal-footer { margin-top: 1.5rem; text-align: right; display: flex; justify-content: flex-end; gap: 10px; }
    
    input[type="password"] { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    #connect-btn { background-color: #2196F3; color: white; }
    #disconnect-btn { background-color: #f44336; color: white; }
    button.cancel { background-color: #ddd; color: #333; }
    
    /* Екран вітання Bluetooth */
    #bt-connect-screen { text-align: center; margin-top: 50px; }
    #bt-connect-btn { background-color: #0056b3; color: white; padding: 15px 30px; font-size: 1.2rem; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    /* Основний екран (ховаймо поки не підключимось) */
    #wifi-screen { display: none; }
    #status-msg { text-align: center; color: #666; margin-bottom: 10px; font-style: italic;}
</style>
</head>
<body>

<div id="bt-connect-screen">
    <h2>Raspberry Pi Wi-Fi Manager</h2>
    <p>Натисніть кнопку, щоб знайти пристрій Raspberry Pi по Bluetooth.</p>
    <button id="bt-connect-btn" onclick="initializeBluetooth()">📡 Знайти Raspberry Pi</button>
</div>

<div id="wifi-screen">
    <div style="text-align:center">
        <h2>Available Networks</h2>
        <div id="status-msg">Сканування...</div>
        <button onclick="requestWifiList()" style="margin-bottom: 15px; font-size: 0.8rem;">🔄 Оновити список</button>
    </div>
    <div id="networks"></div>
</div>

<div class="modal" id="connectModal">
    <div class="modal-content">
        <div class="modal-header">Підключення до <span id="modal-ssid"></span></div>
        <input type="hidden" id="ssid-input">
        
        <div id="password-group">
            <label>Пароль Wi-Fi</label><br>
            <input type="password" id="password-input" placeholder="Введіть пароль">
        </div>
        
        <div class="modal-footer">
            <button class="cancel" onclick="closeModal()">Відміна</button>
            <button id="connect-btn" onclick="sendCredentials()">Підключитись</button>
        </div>
    </div>
</div>

<script>
// --- КОНФІГУРАЦІЯ UUID (Ці ж самі UUID мають бути в Python скрипті на Raspberry) ---
// Я згенерував випадкові UUID для прикладу.
const SERVICE_UUID           = '00000001-710e-4a5b-8d75-3e5b444bc3cf';
const CHAR_NETWORKS_UUID     = '00000002-710e-4a5b-8d75-3e5b444bc3cf'; // Raspberry пише сюди список
const CHAR_CONFIG_UUID       = '00000003-710e-4a5b-8d75-3e5b444bc3cf'; // Телефон пише сюди пароль
const CHAR_STATUS_UUID       = '00000004-710e-4a5b-8d75-3e5b444bc3cf'; // Статус підключення

let bluetoothDevice;
let gattServer;
let configCharacteristic; // Характеристика для запису пароля
let networksCharacteristic; // Характеристика для читання списку

// --- ЛОГІКА BLUETOOTH ---

async function initializeBluetooth() {
    try {
        console.log('Requesting Bluetooth Device...');
        // Браузер відкриє вікно пошуку пристроїв
        bluetoothDevice = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }] 
            // Або можна шукати по імені: { name: 'MyRaspberryPi' }
        });

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        document.getElementById('status-msg').innerText = "Підключення до Bluetooth...";
        
        // Підключаємось до GATT сервера
        gattServer = await bluetoothDevice.gatt.connect();
        console.log('Connected to GATT Server');

        // Отримуємо сервіс
        const service = await gattServer.getPrimaryService(SERVICE_UUID);

        // Отримуємо характеристики
        configCharacteristic = await service.getCharacteristic(CHAR_CONFIG_UUID);
        networksCharacteristic = await service.getCharacteristic(CHAR_NETWORKS_UUID);

        // Перемикаємо UI
        document.getElementById('bt-connect-screen').style.display = 'none';
        document.getElementById('wifi-screen').style.display = 'block';

        // Запитуємо список мереж
        await requestWifiList();

    } catch (error) {
        console.error('Argh! ' + error);
        alert('Помилка підключення Bluetooth: ' + error.message);
    }
}

async function requestWifiList() {
    document.getElementById('status-msg').innerText = "Отримання списку мереж...";
    const container = document.getElementById("networks");
    container.innerHTML = '<div style="text-align:center; padding:20px;">Завантаження...</div>';

    try {
        // Читаємо значення з характеристики
        // УВАГА: Якщо список дуже довгий, у BLE є обмеження на розмір пакету (MTU).
        // У простій реалізації Raspberry має записати JSON у характеристику, а ми її читаємо.
        const value = await networksCharacteristic.readValue();
        const decoder = new TextDecoder('utf-8');
        const jsonString = decoder.decode(value);
        
        const networks = JSON.parse(jsonString);
        renderNetworks(networks);
        document.getElementById('status-msg').innerText = "";
        
    } catch (error) {
        console.error('Error reading networks:', error);
        document.getElementById('status-msg').innerText = "Не вдалося отримати список. Спробуйте ще раз.";
    }
}

// --- ВІДОБРАЖЕННЯ (UI) ---

function renderNetworks(networks) {
    const container = document.getElementById("networks");
    container.innerHTML = "";
    
    if (networks.length === 0) {
        container.innerHTML = "<div style='text-align:center'>Мереж не знайдено</div>";
        return;
    }

    networks.forEach(net => {
        const div = document.createElement("div");
        div.className = "network";
        
        let lockIcon = net.secure ? '<span class="secure">🔒</span>' : '';
        let signalStrength = `<span class='badge signal'>${net.signal}%</span>`;
        
        if (net.connected) {
            signalStrength = `<span class='badge connected'>Підключено</span>`;
        }

        div.innerHTML = `
            <div style="font-weight:bold;">${lockIcon} ${net.ssid}</div>
            <div>${signalStrength}</div>
        `;
        
        // Якщо мережа захищена, просимо пароль, якщо ні — просто конектимо
        div.onclick = () => showDialog(net.ssid, net.secure);
        container.appendChild(div);
    });
}

function showDialog(ssid, secure) {
    document.getElementById("modal-ssid").textContent = ssid;
    document.getElementById("ssid-input").value = ssid;
    document.getElementById("password-input").value = ""; // Очистити старий пароль
    
    const passwordGroup = document.getElementById("password-group");
    passwordGroup.style.display = secure ? "block" : "none";
    
    document.getElementById("connectModal").style.display = "block";
}

function closeModal() {
    document.getElementById("connectModal").style.display = "none";
}

// --- ВІДПРАВКА ДАНИХ (WRITE) ---

async function sendCredentials() {
    const ssid = document.getElementById("ssid-input").value;
    const password = document.getElementById("password-input").value;
    
    const data = {
        ssid: ssid,
        psk: password
    };
    
    try {
        document.getElementById('connect-btn').innerText = "Надсилання...";
        
        // Кодуємо JSON у байти
        const encoder = new TextEncoder();
        const bytes = encoder.encode(JSON.stringify(data));
        
        // Відправляємо на Raspberry Pi
        await configCharacteristic.writeValue(bytes);
        
        alert("Дані відправлено на Raspberry Pi! Вона спробує підключитися.");
        closeModal();
        document.getElementById('connect-btn').innerText = "Підключитись";

    } catch (error) {
        console.error('Error writing credentials:', error);
        alert("Помилка відправки: " + error.message);
    }
}

function onDisconnected(event) {
    alert("Bluetooth з'єднання втрачено!");
    document.getElementById('bt-connect-screen').style.display = 'block';
    document.getElementById('wifi-screen').style.display = 'none';
}

</script>
</body>
</html>
